[package]
name = "senzo"
version = "0.1.0"
edition = "2024"
description = "A native desktop media center for Windows"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "0.1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
