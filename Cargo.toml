[workspace]
members = ["crates/senzo-app", "crates/senzo-diagnostics", "crates/senzo-domain", "crates/senzo-network", "crates/senzo-platform", "crates/senzo-storage", "crates/senzo-ui"]
default-members = ["crates/senzo-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1"
dirs = "6"
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0" }
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
