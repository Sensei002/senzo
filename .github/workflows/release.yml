
name: SENZO desktop builds

on:
  workflow_dispatch:
  push:
    branches: ["main", "development"]
    tags: ["v*"]

concurrency:
  group: senzo-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  # Stable releases come from main or a version tag. Branch builds must never
  # offer the last stable release through the in-app updater.
  SENZO_UPDATE_CHANNEL: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && 'stable' || 'development' }}
  # Must be a SENZO-owned Discord application. Never use Stremio's app id.
  SENZO_DISCORD_APP_ID: ${{ vars.SENZO_DISCORD_APP_ID }}
  SENZO_DISCORD_FALLBACK_IMAGE: ${{ vars.SENZO_DISCORD_FALLBACK_IMAGE }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    env:
      # run-vcpkg otherwise selects the removed x-gha provider. The complete
      # installed tree is cached below with an MSVC-version-specific key.
      VCPKG_BINARY_SOURCES: "clear"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
          targets: x86_64-pc-windows-msvc
      - name: Detect MSVC toolset version for native dependency cache
        id: msvc-version
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $vsPath = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw 'No Visual Studio installation with the x64 C++ toolset was found'
          }

          $toolsRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $toolset = Get-ChildItem -LiteralPath $toolsRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1

          if ($null -eq $toolset) {
            throw "No versioned MSVC toolset directory found under $toolsRoot"
          }

          Write-Output "Detected MSVC toolset: $($toolset.Name)"
          "version=$($toolset.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: Windows-vcpkg-84bab45d-x86-64-v5-msvc-${{ steps.msvc-version.outputs.version }}-static-md-release-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            Windows-vcpkg-84bab45d-x86-64-v5-msvc-${{ steps.msvc-version.outputs.version }}-static-md-release-
      - name: Prepare vcpkg with retries
        shell: pwsh
        run: |
          # Reaching github.com from the Windows runners times out
          # intermittently: both run-vcpkg's clone and its bootstrap download of
          # vcpkg.exe have died on a ~21s connect timeout, failing a whole
          # release build. run-vcpkg has no retry of its own, so do the two
          # network steps here and hand it a directory already at the pinned
          # commit with vcpkg.exe built -- it then skips straight to install.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          $commit = '84bab45d415d22042bd0b9081aea57f362da3f35'

          function Invoke-WithRetry {
            param([string] $What, [scriptblock] $Action)
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & $Action
              if ($LASTEXITCODE -eq 0) { return }
              Write-Output "$What failed with exit $LASTEXITCODE (attempt $attempt of 5)"
              Start-Sleep -Seconds (5 * $attempt)
            }
            throw "$What did not succeed after 5 attempts"
          }

          if (-not (Test-Path (Join-Path $dir '.git'))) {
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WithRetry 'vcpkg clone' {
              git clone https://github.com/microsoft/vcpkg.git -n $dir
            }
          }
          Invoke-WithRetry 'vcpkg checkout' { git -C $dir checkout --force $commit }
          if (-not (Test-Path (Join-Path $dir 'vcpkg.exe'))) {
            Invoke-WithRetry 'vcpkg bootstrap' {
              & (Join-Path $dir 'bootstrap-vcpkg.bat')
            }
          }
          Write-Output "vcpkg ready at $commit"
      - name: Install optimized static libtorrent
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          doNotUpdateVcpkg: true
          vcpkgJsonGlob: "vcpkg.json"
          runVcpkgInstall: true
        env:
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          VCPKG_DEFAULT_TRIPLET: x64-windows-v3-static-md-release
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/vcpkg-overlays
      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg_installed
          key: Windows-vcpkg-84bab45d-x86-64-v5-msvc-${{ steps.msvc-version.outputs.version }}-static-md-release-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
      - uses: Swatinem/rust-cache@v2
      - name: Enable Windows native crash dumps
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "senzo-libtorrent-dumps"
          New-Item -Path $dumpDir -ItemType Directory -Force | Out-Null
          $registryPath = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\libtorrent-smoke.exe"
          New-Item -Path $registryPath -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpFolder -Value $dumpDir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpCount -Value 3 -PropertyType DWord -Force | Out-Null
          "SENZO_LIBUTORRENT_DUMP_DIR=$dumpDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Windows full crash dumps will be written to $dumpDir"
      - name: Build and smoke-test native libtorrent before the desktop app
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "senzo-libtorrent-smoke-build"
          $buildLog = Join-Path $env:RUNNER_TEMP "libtorrent-smoke-build.log"
          $toolchain = Join-Path $env:GITHUB_WORKSPACE "vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake -S tools/libtorrent-smoke -B $buildDir -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-v3-static-md-release -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/triplets" -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE/vcpkg-overlays" -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE/vcpkg_installed" -DCMAKE_BUILD_TYPE=Release *> $buildLog
          $configureExit = $LASTEXITCODE
          if ($configureExit -ne 0) {
            Get-Content $buildLog -Tail 120
            throw "Native libtorrent CMake configure failed with exit code $configureExit"
          }

          cmake --build $buildDir --config Release --verbose *>> $buildLog
          $buildExit = $LASTEXITCODE
          Select-String -Path $buildLog -Pattern "LibtorrentRasterbar|torrent-rasterbar|libtorrent-smoke|error|Error|Linking|Building" |
            Select-Object -Last 100 |
            ForEach-Object { Write-Output $_.Line }
          if ($buildExit -ne 0) {
            throw "Native libtorrent C++ smoke build failed with exit code $buildExit. Full log: $buildLog"
          }

          $smoke = Get-ChildItem -Path $buildDir -Filter "libtorrent-smoke.exe" -Recurse -File | Select-Object -First 1
          if (-not $smoke) { throw "CMake completed but libtorrent-smoke.exe was not found under $buildDir" }
          Write-Output "Running direct C++ libtorrent session smoke test: $($smoke.FullName)"
          & $smoke.FullName
          $smokeExit = $LASTEXITCODE
          if ($smokeExit -ne 0) {
            Write-Output "Native C++ smoke test exited with $smokeExit"
            Write-Output "Crash dump directory: $env:SENZO_LIBUTORRENT_DUMP_DIR"
            throw "Direct libtorrent session startup failed with exit code $smokeExit"
          }
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          VCPKG_TARGET_TRIPLET: x64-windows-v3-static-md-release
      - name: Install compatible LLVM for autocxx bindings
        shell: pwsh
        run: |
          # The Windows 2025 image currently ships MSVC 14.52, whose STL
          # headers require Clang 22 or newer. Do not trust whichever LLVM
          # version happens to be preinstalled on the hosted runner.
          # The Chocolatey community feed has answered 503/504 on every
          # attempt for days, so install the official LLVM release instead.
          $llvmVersion = '23.1.3'
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          $libClang = Join-Path $llvmBin 'libclang.dll'
          $clangExe = Join-Path $llvmBin 'clang.exe'
          $msiSha256 = '5153f848ac87553118340f16f8d3cd4351d729bcba6e4785c6a4a9af29676de9'

          function Get-ClangMajor {
            if (-not (Test-Path $clangExe)) { return 0 }
            $first = & $clangExe --version | Select-Object -First 1
            if ($first -match 'clang version (\d+)') { return [int]$Matches[1] }
            return 0
          }

          if ((Get-ClangMajor) -lt 22 -or -not (Test-Path $libClang)) {
            $msi = Join-Path $env:RUNNER_TEMP "LLVM-$llvmVersion-win64.msi"
            $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-win64.msi"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Output "Downloading $url (attempt $attempt of 3)"
              curl.exe --fail --location --silent --show-error --retry 3 --retry-delay 5 --connect-timeout 30 --output $msi $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $msi) -and
                  (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash -eq $msiSha256) { break }
              Remove-Item -LiteralPath $msi -Force -ErrorAction SilentlyContinue
              if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
            }
            if (-not (Test-Path $msi)) { throw "Could not download LLVM $llvmVersion from $url" }
            $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
            if ($hash -ne $msiSha256) { throw "LLVM $llvmVersion download checksum mismatch: $hash" }

            Write-Output "Installing LLVM $llvmVersion"
            $install = Start-Process -FilePath 'msiexec.exe' -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', 'ALLUSERS=1')
            # 0 is success; 3010 means success with a pending reboot.
            if ($install.ExitCode -ne 0 -and $install.ExitCode -ne 3010) {
              throw "LLVM $llvmVersion installer failed with exit code $($install.ExitCode)"
            }
          }

          if (-not (Test-Path $libClang)) {
            throw "LLVM $llvmVersion installation is missing libclang.dll at $libClang"
          }
          if (-not (Test-Path $clangExe)) {
            throw "LLVM $llvmVersion installation is missing clang.exe at $clangExe"
          }

          $clangVersion = (& $clangExe --version | Select-Object -First 1)
          Write-Output "Using $clangVersion"
          if ((Get-ClangMajor) -lt 22) {
            throw "Expected Clang 22 or newer from LLVM $llvmVersion, got: $clangVersion"
          }

          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build release with line-table crash symbols
        shell: pwsh
        run: |
          # Never let a stale PDB from a restored target directory be mistaken
          # for symbols matching this executable.
          Get-Item -LiteralPath "target/release/senzo.pdb" -ErrorAction SilentlyContinue |
            Remove-Item -Force

          # Add minimal source-line debug information only to the application
          # target. Dependencies retain the normal stripped release profile,
          # keeping the existing Cargo dependency cache reusable.
          cargo rustc --locked --release --package senzo --bin senzo -- -C debuginfo=line-tables-only -C strip=none
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          VCPKGRS_TRIPLET: x64-windows-v3-static-md-release
          LIBTORRENT_STATIC: "1"
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-windows-v3-static-md-release/lib/pkgconfig
      - name: Verify Windows crash debug symbols
        shell: pwsh
        run: |
          $pdb = Get-Item -LiteralPath "target/release/senzo.pdb" -ErrorAction Stop
          if ($pdb.Length -lt 1MB) {
            throw "The executable PDB is unexpectedly small ($($pdb.Length) bytes)"
          }

          Write-Output ("Verified executable PDB: {0} ({1:N0} bytes)" -f $pdb.FullName, $pdb.Length)
      - name: Stage app-local MSVC runtime
        shell: pwsh
        run: ./scripts/stage_windows_msvc_runtime.ps1 -BuildRoot ./target/release
      - name: Verify runtime bundle
        shell: pwsh
        run: |
          $root = "target/release"
          @("senzo.exe", "libmpv-2.dll", "licenses/mpv/LICENSE.GPL", "licenses/mpv/LICENSE.LGPL") | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) { throw "Missing release artifact: $_" }
          }
      - name: Provide Inno Setup for the installer
        shell: pwsh
        run: |
          # create_setup.cmd needs ISCC.exe. GitHub's Windows images ship Inno
          # Setup; the Blacksmith one does not, so install it when missing and
          # hand the script an explicit ISCC_EXE instead of letting it probe.
          $roots = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 6"
          )
          function Find-Iscc {
            foreach ($root in $roots) {
              $candidate = Join-Path $root 'ISCC.exe'
              if (Test-Path $candidate) { return $candidate }
            }
            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Output 'Inno Setup not present on the image; installing'
            choco install innosetup --no-progress --yes
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            throw "ISCC.exe not found after installing Inno Setup; searched: $($roots -join '; ')"
          }
          Write-Output "Using Inno Setup at $iscc"
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer and updater archive
        shell: cmd
        run: |
          set "SKIP_BUILD=1"
          call setup\create_setup.cmd
      - name: Upload Windows crash debug symbols
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: senzo-windows-x64-pdb
          path: |
            target/release/senzo.pdb
            ${{ runner.temp }}/senzo-libtorrent-smoke-build/Release/libtorrent-smoke.pdb
            ${{ runner.temp }}/senzo-libtorrent-smoke-build/Release/libtorrent-smoke.map
          if-no-files-found: warn
          compression-level: 1
      - name: Upload Windows native crash dump
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: senzo-windows-x64-libtorrent-crash-dump
          path: ${{ runner.temp }}/senzo-libtorrent-dumps/*.dmp
          if-no-files-found: warn
          compression-level: 1
      - name: Upload libtorrent smoke build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: senzo-windows-x64-libtorrent-build-log
          path: ${{ runner.temp }}/libtorrent-smoke-build.log
          if-no-files-found: warn
          compression-level: 1
      - uses: actions/upload-artifact@v7
        with:
          name: senzo-windows-x64
          path: |
            target/release/senzo.exe
            target/release/libmpv-2.dll
            target/release/msvc-runtime
            target/release/licenses/mpv
            artifacts/SENZO-Setup-v*-x64.exe
            artifacts/senzo-v*-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  linux:
    if: github.ref != 'refs/heads/fix/windows-libtorrent-session-smoke'
    name: Linux x64
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_DEFAULT_TRIPLET: x64-linux-v3-static-release
      VCPKGRS_TRIPLET: x64-linux-v3-static-release
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/vcpkg-overlays
      PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-v3-static-release/lib/pkgconfig
      LIBTORRENT_STATIC: "1"
      # Keep the Linux runner within its memory budget. The release profile
      # otherwise compiles many heavy native/Slint crates in parallel.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libssl-dev libclang-dev libgtk-3-dev libayatana-appindicator3-dev libmpv-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Restore libtorrent cache
        id: libtorrent-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: Linux-vcpkg-x64-linux-v3-static-release-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            Linux-vcpkg-x64-linux-v3-static-release-v1-
      - name: Install static libtorrent 2.1.1
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgJsonGlob: "vcpkg.json"
          runVcpkgInstall: true
      - name: Save libtorrent cache
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg_installed
          key: Linux-vcpkg-x64-linux-v3-static-release-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
      - name: Add swap headroom
        shell: bash
        run: |
          if ! swapon --show | grep -q '/swapfile'; then
            sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h
      - name: Build release
        run: |
          set -o pipefail
          cargo build --locked --release --package senzo 2>&1 | tee build.log
      - name: Report build failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=Build log::build.log was not created"
            exit 0
          fi
          clean=$(mktemp)
          sed -r 's/\x1B\[[0-9;]*[mK]//g' build.log > "$clean"
          n=$(grep -n -m1 -E '^error(\[|:)' "$clean" | cut -d: -f1 || true)
          if [ -z "$n" ]; then
            n=$(grep -n -m1 -E 'error(\[|:)' "$clean" | cut -d: -f1 || true)
          fi
          if [ -z "$n" ]; then
            n=$(( $(wc -l < "$clean") - 40 ))
          fi
          msg=$(sed -n "${n},$((n+25))p" "$clean" | sed 's/::/ - /g; s/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Rust build error::$msg"
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-deb
      - name: Build DEB Package
        run: cargo deb --package senzo --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: senzo-linux-x64
          path: target/release/senzo
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: senzo-linux-deb
          path: target/debian/*.deb
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            # GitHub retired the macos-14 image; macos-15 is the same arm64 class.
            runner: macos-15
            triplet: arm64-osx-v3-static-release
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            triplet: x64-osx-v3-static-release
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKGRS_TRIPLET: ${{ matrix.triplet }}
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/vcpkg-overlays
      PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/${{ matrix.triplet }}/lib/pkgconfig
      # The bundled libtorrent and the app are both built for this floor, so a
      # mismatch cannot produce a bundle that only runs on the build machine.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      LIBTORRENT_STATIC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - name: Install native dependencies
        run: |
          brew update --quiet
          # mpv ships libmpv and its pkg-config file; dylibbundler collects the
          # non-system libraries into the app bundle.
          brew install pkg-config mpv dylibbundler
      - name: Restore libtorrent cache
        id: libtorrent-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: macOS-${{ matrix.arch }}-vcpkg-${{ matrix.triplet }}-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            macOS-${{ matrix.arch }}-vcpkg-${{ matrix.triplet }}-v1-
      - name: Install static libtorrent 2.1.1
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgJsonGlob: "vcpkg.json"
          runVcpkgInstall: true
      - name: Save libtorrent cache
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg_installed
          key: macOS-${{ matrix.arch }}-vcpkg-${{ matrix.triplet }}-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
      - name: Build release
        run: |
          set -o pipefail
          cargo build --locked --release --package senzo 2>&1 | tee build.log
      - name: Report build failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=Build log::build.log was not created"
            exit 0
          fi
          clean=$(mktemp)
          sed -r 's/\x1B\[[0-9;]*[mK]//g' build.log > "$clean"
          n=$(grep -n -m1 -E '^error(\[|:)' "$clean" | cut -d: -f1 || true)
          if [ -z "$n" ]; then
            n=$(( $(wc -l < "$clean") - 40 ))
          fi
          msg=$(sed -n "${n},$((n+25))p" "$clean" | sed 's/::/ - /g; s/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Rust build error::$msg"
      - name: Package app bundle
        run: |
          bash scripts/package_macos.sh \
            --arch "${{ matrix.arch }}" \
            --tag "${GITHUB_REF_NAME}" \
            --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: senzo-macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # The runner image already ships the Android command line tools, so
          # only the exact platform and build tools are added here.
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "::error title=Android SDK::no sdkmanager under $sdk"
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
          } >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/senzo-release.jks"
          password="${KEYSTORE_PASSWORD:-senzo-development}"
          alias="${KEY_ALIAS:-senzo}"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          else
            # No repository secret yet: a throwaway key still produces an
            # installable APK, it just cannot upgrade an earlier install.
            keytool -genkeypair -keystore "$keystore" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$password" -keypass "${KEY_PASSWORD:-$password}" \
              -dname "CN=SENZO, O=SENZO, C=US"
          fi
          {
            echo "SENZO_KEYSTORE=$keystore"
            echo "SENZO_KEYSTORE_PASSWORD=$password"
            echo "SENZO_KEY_ALIAS=$alias"
            echo "SENZO_KEY_PASSWORD=${KEY_PASSWORD:-$password}"
          } >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          set -euo pipefail
          cd android
          # A tag names the release; a branch build keeps the desktop version
          # from app/Cargo.toml and only bumps the build number.
          versionName="${GITHUB_REF_NAME#v}"
          args=(-PsenzoVersionCode="${GITHUB_RUN_NUMBER}")
          if printf '%s' "$versionName" | grep -Eq '^[0-9]+\.[0-9]+'; then
            args+=(-PsenzoVersionName="$versionName")
          fi
          gradle --no-daemon --console=plain :app:assembleRelease "${args[@]}"
      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "dist/senzo-${GITHUB_REF_NAME}.apk"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: senzo-android-apk
          path: dist/*.apk
          if-no-files-found: error
  arch:
    name: Arch Linux x64
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: senzo-linux-x64
          path: target/release
      - name: Install packaging dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel
      - name: Create PKGBUILD
        run: |
          pkgver=$(grep -m1 'version = ' app/Cargo.toml | cut -d '"' -f2)
          mkdir -p pkg
          cat > pkg/PKGBUILD << EOF
          # Maintainer: perpetus <perpetus.github@gmail.com>
          pkgname=senzo
          pkgver=${pkgver}
          pkgrel=1
          pkgdesc="SENZO native media center built with Rust and Slint"
          arch=('x86_64')
          url="https://github.com/Sensei002/senzo"
          license=('GPL-3.0')
          depends=('openssl' 'mpv' 'gtk3' 'libayatana-appindicator' 'fontconfig' 'freetype2' 'libxkbcommon' 'libxcursor' 'libx11' 'wayland')
          options=('!strip' '!debug')
          source=("senzo")
          sha256sums=('SKIP')

          package() {
              install -Dm755 "\$srcdir/senzo" "\$pkgdir/usr/bin/senzo"
              install -Dm644 "\$startdir/assets/linux/senzo.desktop" "\$pkgdir/usr/share/applications/senzo.desktop"
              install -Dm644 "\$startdir/assets/linux/com.senzo.SENZO.metainfo.xml" "\$pkgdir/usr/share/metainfo/com.senzo.SENZO.metainfo.xml"
              install -Dm644 "\$startdir/assets/app_icon.png" "\$pkgdir/usr/share/icons/hicolor/512x512/apps/senzo.png"
          }
          EOF
          cp target/release/senzo pkg/senzo
          mkdir -p pkg/assets/linux
          cp assets/linux/senzo.desktop pkg/assets/linux/
          cp assets/linux/com.senzo.SENZO.metainfo.xml pkg/assets/linux/
          cp app/ui/assets/images/app_icon.png pkg/assets/
      - name: Build package
        run: |
          cd pkg
          mapfile -t runtime_deps < <(bash -c 'source ./PKGBUILD; printf "%s\n" "${depends[@]}"')
          pacman -S --needed --noconfirm "${runtime_deps[@]}"
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg --noconfirm"
      - name: Upload Arch Package
        uses: actions/upload-artifact@v7
        with:
          name: senzo-arch-pkg
          path: pkg/*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: Fedora x64
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: senzo-linux-x64
          path: target/release
      - name: Restore dnf cache
        id: dnf-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/cache/dnf
          key: fedora-dnf-rpm-build
      - name: Install packaging dependencies
        run: |
          dnf install -y rpm-build
      - name: Save dnf cache
        if: steps.dnf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /var/cache/dnf
          key: fedora-dnf-rpm-build
      - name: Create RPM Spec
        run: |
          pkgver=$(grep -m1 'version = ' app/Cargo.toml | cut -d '"' -f2)
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp target/release/senzo rpmbuild/SOURCES/
          cp assets/linux/senzo.desktop rpmbuild/SOURCES/
          cp assets/linux/com.senzo.SENZO.metainfo.xml rpmbuild/SOURCES/
          cp app/ui/assets/images/app_icon.png rpmbuild/SOURCES/senzo.png
          cat > rpmbuild/SPECS/senzo.spec << 'SPEC'
          Name:           senzo
          Version:        __VERSION__
          Release:        1%{?dist}
          Summary:        SENZO native media center built with Rust and Slint
          License:        GPLv3
          URL:            https://github.com/Sensei002/senzo
          Source0:        senzo
          Requires:       openssl mpv-libs gtk3 libayatana-appindicator-gtk3 fontconfig freetype libxkbcommon libXcursor libX11 libwayland-client

          %description
          SENZO native media center built with Rust and Slint.

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}%{_bindir}
          install -p -m 755 %{_sourcedir}/senzo %{buildroot}%{_bindir}/senzo
          install -Dm644 %{_sourcedir}/senzo.desktop %{buildroot}%{_datadir}/applications/senzo.desktop
          install -Dm644 %{_sourcedir}/com.senzo.SENZO.metainfo.xml %{buildroot}%{_datadir}/metainfo/com.senzo.SENZO.metainfo.xml
          install -Dm644 %{_sourcedir}/senzo.png %{buildroot}%{_datadir}/icons/hicolor/512x512/apps/senzo.png

          %files
          %{_bindir}/senzo
          %{_datadir}/applications/senzo.desktop
          %{_datadir}/metainfo/com.senzo.SENZO.metainfo.xml
          %{_datadir}/icons/hicolor/512x512/apps/senzo.png

          %changelog
          * Sun Jul 19 2026 perpetus <perpetus.github@gmail.com> - __VERSION__-1
          - Initial release
          SPEC
          sed -i "s/__VERSION__/$pkgver/g" rpmbuild/SPECS/senzo.spec
      - name: Validate RPM runtime dependencies
        run: |
          read -r -a runtime_deps <<< "$(sed -n 's/^Requires:[[:space:]]*//p' rpmbuild/SPECS/senzo.spec)"
          dnf install -y "${runtime_deps[@]}"
      - name: Build RPM Package
        run: |
          rpmbuild -bb rpmbuild/SPECS/senzo.spec --define "_topdir $(pwd)/rpmbuild"
      - name: Upload RPM Package
        uses: actions/upload-artifact@v7
        with:
          name: senzo-fedora-rpm
          path: rpmbuild/RPMS/x86_64/*.rpm
          if-no-files-found: error

  release:
    name: Publish tagged release
    needs: [windows, linux, macos, android, arch, fedora]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          copy_latest() {
            local pattern="$1"
            local source
            source="$(find artifacts -type f -name "$pattern" | sort -V | tail -n 1)"
            if [[ -z "$source" ]]; then
              echo "Missing required release asset: $pattern" >&2
              exit 1
            fi
            cp "$source" release/
          }

          copy_latest "SENZO-Setup-v*-x64.exe"
          copy_latest "senzo-v*-x86_64-pc-windows-msvc.zip"
          copy_latest "senzo-v*-aarch64-apple-darwin.zip"
          copy_latest "senzo-v*-x86_64-apple-darwin.zip"
          copy_latest "senzo-v*.apk"
          copy_latest "*.deb"
          copy_latest "senzo-[0-9]*.pkg.tar.zst"
          copy_latest "*.rpm"

          linux_binary="$(find artifacts/senzo-linux-x64 -type f -name senzo | head -n 1)"
          if [[ -z "$linux_binary" ]]; then
            echo "Missing required Linux release binary" >&2
            exit 1
          fi
          linux_asset="release/senzo-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          cp "$linux_binary" "$linux_asset"
          chmod +x "$linux_asset"

          (cd release && sha256sum * > SHA256SUMS.txt)
          find release -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Prepare release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          python scripts/generate_release_notes.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --previous-tag "${previous_tag}" \
            --asset-dir release \
            --changelog CHANGELOG.md \
            --output "${GITHUB_WORKSPACE}/RELEASE_BODY.md"
          cat "${GITHUB_WORKSPACE}/RELEASE_BODY.md"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
