name: SENZO Desktop CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      run_live_api_acceptance:
        description: "Run live hosted API and TMDB artwork acceptance on Windows"
        required: true
        default: false
        type: boolean
      api_base_url:
        description: "Hosted API base URL (production or a Vercel Preview deployment)"
        required: false
        default: "https://senzo-api.vercel.app"
        type: string

permissions:
  contents: write

concurrency:
  # Phase 8 provider acceptance has its own queue, separate from the Phase 7 close-out run.
  group: senzo-desktop-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows native desktop
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Resolve workspace lockfile
        run: cargo generate-lockfile
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Verify Phase 11 TV playback continuity and persistence
        run: |
          cargo test -p senzo-sources stremio_behavior_hints_and_file_index_survive_source_normalization --locked
          cargo test -p senzo-storage phase11_ --locked
          cargo test -p senzo-ui phase11_ --locked
      - name: Verify Phase 12 profiles, library and cloud sync
        run: |
          cargo test -p senzo-domain profile_scope_ --locked
          cargo test -p senzo-storage phase12_ --locked
          cargo test -p senzo-sync --locked
          cargo test -p senzo-ui phase12_ --locked
      - name: Verify Phase 13 downloads and P2P transport
        run: |
          cargo test -p senzo-downloads --locked
          cargo test -p senzo-player local_files_must_exist_before_they_can_be_played --locked
      - name: Build native Windows application
        run: cargo build --release --locked -p senzo-app
      - name: Smoke-test native window startup and shutdown
        run: cargo run --release --locked -p senzo-app -- --smoke-test
        timeout-minutes: 3
      - name: Package Windows application and native libmpv runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mpvVersion = "0.42.0"
          $mpvArchiveName = "libmpv-v0.42.0-x86_64-w64-mingw32-lgpl.zip"
          $mpvSha256 = "8e5f77430efc53ef175804ba6618527e3af0448a0dcabf04d3cc72659d1a6fce"
          $mpvUrl = "https://github.com/mpv-player/mpv/releases/download/v$mpvVersion/$mpvArchiveName"
          $archivePath = Join-Path $env:RUNNER_TEMP $mpvArchiveName
          $extractPath = Join-Path $env:RUNNER_TEMP "senzo-libmpv-runtime"
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "target/release/senzo-windows-x64"
          Invoke-WebRequest -Uri $mpvUrl -OutFile $archivePath
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $mpvSha256) { throw "libmpv archive SHA-256 mismatch: $actualHash" }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $library = Get-ChildItem -Path $extractPath -Recurse -File |
            Where-Object { $_.Name -in @("libmpv-2.dll", "mpv-2.dll") } |
            Select-Object -First 1
          if (-not $library) { throw "The pinned libmpv archive did not contain libmpv-2.dll or mpv-2.dll." }
          $runtimeDlls = Get-ChildItem -Path $extractPath -Recurse -File -Filter "*.dll"
          if (-not $runtimeDlls) { throw "The pinned libmpv archive did not contain runtime DLLs." }
          New-Item -ItemType Directory -Path $packagePath -Force | Out-Null
          Copy-Item -LiteralPath "target/release/senzo.exe" -Destination $packagePath
          $duplicateNames = $runtimeDlls | Group-Object Name | Where-Object Count -gt 1
          if ($duplicateNames) {
            $names = ($duplicateNames | ForEach-Object Name) -join ", "
            throw "The libmpv archive contains duplicate DLL names; refusing an ambiguous bundle: $names"
          }
          foreach ($dll in $runtimeDlls) { Copy-Item -LiteralPath $dll.FullName -Destination $packagePath }
          $mpvShare = Get-ChildItem -Path $extractPath -Recurse -Directory -Filter "mpv" |
            Where-Object { $_.Parent.Name -eq "share" } |
            Select-Object -First 1
          if ($mpvShare) {
            $sharePath = Join-Path $packagePath "share"
            New-Item -ItemType Directory -Path $sharePath -Force | Out-Null
            Copy-Item -Path $mpvShare.FullName -Destination (Join-Path $sharePath "mpv") -Recurse -Force
          }
          $licenseFiles = Get-ChildItem -Path $extractPath -Recurse -File |
            Where-Object { $_.Name -match "^(LICENSE|COPYING|NOTICE)(\..*)?$" }
          if ($licenseFiles) {
            $licensePath = Join-Path $packagePath "third-party-licenses/mpv"
            New-Item -ItemType Directory -Path $licensePath -Force | Out-Null
            foreach ($file in $licenseFiles) { Copy-Item -LiteralPath $file.FullName -Destination $licensePath -Force }
          }
          @(
            "SENZO Windows native runtime bundle",
            "libmpv version: mpv $mpvVersion",
            "Build: upstream mpv LGPL x86_64 Windows CI package",
            "Source: https://github.com/mpv-player/mpv/tree/v$mpvVersion",
            "Runtime archive: $mpvUrl",
            "Runtime archive SHA-256: $mpvSha256",
            "The upstream libmpv package and its third-party components retain their respective licenses."
          ) | Set-Content -Path (Join-Path $packagePath "MPV-RUNTIME.txt") -Encoding utf8
          if (-not (Test-Path (Join-Path $packagePath $library.Name))) {
            throw "The selected libmpv DLL was not copied beside senzo.exe."
          }
      - name: Verify bundled Windows libmpv runtime
        shell: pwsh
        env:
          SENZO_LIBMPV_TEST_PATH: ${{ github.workspace }}\target\release\senzo-windows-x64\libmpv-2.dll
        run: cargo test -p senzo-player packaged_windows_libmpv_runtime_initializes_headlessly --locked
      - name: Set up Node.js for live native integration
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.run_live_api_acceptance) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-api-acceptance]'))
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise native metadata client and artwork against hosted API
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.run_live_api_acceptance) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-api-acceptance]'))
        env:
          SENZO_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url != '' && inputs.api_base_url || 'https://senzo-api-git-development-stream-anything.vercel.app' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/native-metadata-smoke.mjs
      - name: Upload Windows foundation binary
        uses: actions/upload-artifact@v4
        with:
          name: senzo-windows-x64-development-${{ github.sha }}
          path: target/release/senzo-windows-x64/**
          if-no-files-found: error
          retention-days: 14

  automation-scripts:
    name: Validate repository automation scripts
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate live acceptance scripts and URL safety
        run: |
          node --check scripts/live-api-acceptance.mjs
          node --check scripts/live-api-url.mjs
          node --check scripts/native-metadata-smoke.mjs
          node --test scripts/live-api-url.test.mjs
          bash -n scripts/mpv-headless-acceptance.sh
          python3 -m py_compile scripts/mpv-range-server.py scripts/validate-mpv-headless.py

  live-api-acceptance:
    name: Live hosted API acceptance (Windows)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_live_api_acceptance) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-api-acceptance]'))
    env:
      SENZO_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_base_url != '' && inputs.api_base_url || 'https://senzo-api-git-development-stream-anything.vercel.app' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live hosted metadata and artwork
        run: node scripts/live-api-acceptance.mjs

  live-addon-acceptance:
    name: Live Stremio add-on acceptance (Windows)
    timeout-minutes: 20
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-addon-acceptance]')
    strategy:
      fail-fast: false
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Resolve workspace lockfile
        run: cargo generate-lockfile
      - name: Verify public Stremio manifest and catalogue compatibility
        run: cargo test -p senzo-addons live_ -- --ignored --nocapture

  lockfile:
    name: Commit resolved Cargo.lock
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [windows]
    runs-on: windows-2022
    steps:
      - name: Checkout latest development
        uses: actions/checkout@v4
        with:
          ref: development
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Format sources and commit lockfile
        shell: bash
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git add Cargo.lock crates
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: lock SENZO workspace dependencies"
            git push origin HEAD:development
          fi
