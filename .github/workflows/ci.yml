name: Windows CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --locked

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build Windows x64 release executable
        run: cargo build --release --locked --bin senzo

      - name: Package upstream LGPL MPV runtime
        shell: pwsh
        run: ./scripts/package-mpv-runtime.ps1

      - name: Assemble Windows x64 package
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\SENZO"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath "target\release\senzo.exe" -Destination $stage
          Copy-Item -LiteralPath "runtime" -Destination (Join-Path $stage "runtime") -Recurse

          $licenses = Join-Path $stage "licenses"
          New-Item -ItemType Directory -Path $licenses -Force | Out-Null
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $licenses "SENZO-AGPL-3.0-only.txt")
          Copy-Item -LiteralPath "licenses\Apache-2.0.txt" -Destination $licenses
          Copy-Item -LiteralPath "licenses\librqbit-NOTICE.md" -Destination $licenses
          Copy-Item -LiteralPath "README.md" -Destination $stage

          $branding = Join-Path $stage "assets\branding"
          New-Item -ItemType Directory -Path $branding -Force | Out-Null
          Copy-Item -LiteralPath "assets\branding\senzo-logo.png" -Destination $branding

          $cargo = Get-Content -LiteralPath "Cargo.toml" -Raw
          $versionMatch = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) {
            throw "Could not read the SENZO package version"
          }
          $manifest = [ordered]@{
            application = "SENZO"
            version = $versionMatch.Groups[1].Value
            commit = $env:GITHUB_SHA
            target = "x86_64-pc-windows-msvc"
            torrent_engine = "librqbit 9.1.0 (statically linked)"
            torrent_upload_seeding_support = "compiled out"
            torrent_session_storage = "%LOCALAPPDATA%\SENZO\torrent-temp"
            mpv_runtime = "mpv 0.42.0 LGPL x64"
          }
          $manifest | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $stage "package-manifest.json") -Encoding utf8

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: senzo-windows-x64-${{ github.sha }}
          path: dist/SENZO/
          if-no-files-found: error
          retention-days: 14
