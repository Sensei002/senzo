name: SENZO Windows CI

on:
  push:
    branches: [main, development, migration/stremio-native]
  pull_request:
    branches: [main, development, migration/stremio-native]
  workflow_dispatch:
    inputs:
      extended_checks:
        description: Run Clippy and the full workspace test suite
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: senzo-windows-ci-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  SENZO_MPV_CACHE_DIR: ${{ github.workspace }}\.mpv-cache
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
  VCPKG_DEFAULT_TRIPLET: x64-windows-v3-static-md-release
  VCPKGRS_TRIPLET: x64-windows-v3-static-md-release
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\triplets
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\vcpkg-overlays
  PKG_CONFIG_PATH: ${{ github.workspace }}\vcpkg_installed\x64-windows-v3-static-md-release\lib\pkgconfig

jobs:
  windows:
    name: Windows x64 native application
    runs-on: windows-2022
    steps:
      - name: Checkout SENZO and upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-31
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Provide libclang for native dependency bindings
        shell: pwsh
        run: |
          $roots = @(
            'C:\Program Files\LLVM\bin',
            'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin'
          )
          $llvmBin = $roots | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          if (-not $llvmBin) {
            choco install llvm --no-progress --yes
            $llvmBin = $roots | Where-Object { Test-Path (Join-Path $_ 'libclang.dll') } | Select-Object -First 1
          }
          if (-not $llvmBin) { throw "libclang.dll was not found." }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Export GitHub Actions cache environment for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_installed
          key: Windows-vcpkg-x86-64-v3-static-md-release-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            Windows-vcpkg-x86-64-v3-static-md-release-

      - name: Restore MPV SDK cache
        id: mpv-cache
        uses: actions/cache/restore@v4
        with:
          path: .mpv-cache
          key: Windows-mpv-sdk-${{ hashFiles('mpv.lock.json') }}

      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '84bab45d415d22042bd0b9081aea57f362da3f35'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          if (-not (Test-Path (Join-Path $dir '.git'))) {
            git clone https://github.com/microsoft/vcpkg.git -n $dir
            if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed." }
          }
          git -C $dir checkout --force $commit
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout failed." }
          if (-not (Test-Path (Join-Path $dir 'vcpkg.exe'))) {
            & (Join-Path $dir 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }
          }

      - name: Install native dependencies (libtorrent and OpenSSL)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          doNotUpdateVcpkg: true
          vcpkgJsonGlob: "vcpkg.json"
          runVcpkgInstall: true
        env:
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
          VCPKG_DEFAULT_TRIPLET: x64-windows-v3-static-md-release
          VCPKGRS_TRIPLET: x64-windows-v3-static-md-release
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\triplets
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\vcpkg-overlays

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg_installed
          key: Windows-vcpkg-x86-64-v3-static-md-release-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}

      - name: Run Clippy
        if: github.event_name == 'pull_request' || inputs.extended_checks
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        if: github.event_name == 'pull_request' || inputs.extended_checks
        run: cargo test --workspace --all-targets --locked

      - name: Build SENZO release binary
        run: cargo build --locked --release --package senzo

      - name: Save MPV SDK cache
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .mpv-cache
          key: Windows-mpv-sdk-${{ hashFiles('mpv.lock.json') }}

      - name: Stage app-local MSVC runtime
        shell: pwsh
        run: ./scripts/stage_windows_msvc_runtime.ps1 -BuildRoot ./target/release

      - name: Verify built runtime files
        shell: pwsh
        run: |
          $required = @(
            "target/release/senzo.exe",
            "target/release/libmpv-2.dll",
            "target/release/licenses/mpv/LICENSE.GPL",
            "target/release/licenses/mpv/LICENSE.LGPL"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required release file missing: $path" }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package SENZO installer and updater archive
        shell: cmd
        run: |
          set "SKIP_BUILD=1"
          call setup\create_setup.cmd

      - name: Upload SENZO Windows build
        uses: actions/upload-artifact@v4
        with:
          name: senzo-windows-x64-${{ github.sha }}
          path: |
            target/release/senzo.exe
            target/release/libmpv-2.dll
            target/release/msvc-runtime/**
            target/release/licenses/mpv/**
            artifacts/SENZO-Setup-v*-x64.exe
            artifacts/senzo-v*-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          retention-days: 14
