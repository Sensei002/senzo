name: SENZO Desktop CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senzo-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows native desktop
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Resolve workspace lockfile
        run: cargo generate-lockfile
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Build native Windows application
        run: cargo build --release --locked -p senzo-app
      - name: Smoke-test native window startup and shutdown
        run: cargo run --release --locked -p senzo-app -- --smoke-test
        timeout-minutes: 3
      - name: Upload Windows foundation binary
        uses: actions/upload-artifact@v4
        with:
          name: senzo-windows-x64-development-${{ github.sha }}
          path: target/release/senzo.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux native desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Install GPUI and credential-store build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libdbus-1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev \
            libegl1-mesa-dev libgles2-mesa-dev libglib2.0-dev libfontconfig-dev \
            libgl1-mesa-dri mesa-vulkan-drivers xvfb xauth
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Resolve workspace lockfile
        run: cargo generate-lockfile
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --locked
      - name: Build native Linux application
        run: cargo build --release --locked -p senzo-app
      - name: Smoke-test native window startup and shutdown
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 cargo run --release --locked -p senzo-app -- --smoke-test
        timeout-minutes: 3
      - name: Upload Linux foundation binary
        uses: actions/upload-artifact@v4
        with:
          name: senzo-linux-x64-development-${{ github.sha }}
          path: target/release/senzo
          if-no-files-found: error
          retention-days: 14

  lockfile:
    name: Commit resolved Cargo.lock
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest development
        uses: actions/checkout@v4
        with:
          ref: development
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Format sources and commit lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git add Cargo.lock crates
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: lock SENZO workspace dependencies"
            git push origin HEAD:development
          fi
