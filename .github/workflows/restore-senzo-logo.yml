name: Restore canonical SENZO logo

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/restore-senzo-logo.yml

permissions:
  contents: write

jobs:
  restore-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and validate uploaded logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/branding
          curl --fail --location --silent --show-error \
            'https://github.com/user-attachments/assets/58d7e1c8-a7d8-48ff-95b8-6982ec2be33e' \
            --output assets/branding/senzo-logo.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("assets/branding/senzo-logo.png")
          data = p.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Uploaded attachment is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (1536, 1024):
              raise SystemExit(f"Unexpected logo dimensions: {width}x{height}")
          print(f"Validated canonical logo: {width}x{height}, {len(data)} bytes")
          PY
      - name: Commit logo and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-senzo-logo.yml
          git add assets/branding/senzo-logo.png
          git commit -m "Restore transparent SENZO branding logo"
          git push origin HEAD:development
