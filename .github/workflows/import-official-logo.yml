name: Import Official SENZO Logo
run-name: Import canonical logo from issue #1

on:
  push:
    branches: [development]
    paths:
      - ".github/workflows/import-official-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Download the exact issue attachment
        run: |
          mkdir -p assets/branding
          curl --fail --location --retry 3 \
            "https://github.com/user-attachments/assets/f5b1fae9-02b3-4ce4-b6f2-55710befe5f3" \
            --output assets/branding/senzo-logo.png
          file assets/branding/senzo-logo.png
          test "$(od -An -tx1 -N8 assets/branding/senzo-logo.png | tr -d ' \n')" = "89504e470d0a1a0a"

      - name: Commit original artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/senzo-logo.png
          if git diff --cached --quiet; then
            echo "Logo is already present and unchanged."
            exit 0
          fi
          git commit -m "branding: add official SENZO logo artwork"
          git push origin HEAD:development
