name: Import Stremio Native foundation into SENZO

on:
  push:
    branches:
      - migration/stremio-native
    paths:
      - .github/workflows/import-stremio-native.yml

permissions:
  contents: write

concurrency:
  group: senzo-stremio-native-import
  cancel-in-progress: false

jobs:
  import:
    name: Import pinned Stremio Native source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SENZO migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/stremio-native
          fetch-depth: 0

      - name: Import source tree and preserve SENZO logo
        shell: bash
        env:
          UPSTREAM_SHA: 936ee48771bb3d9c242ebc029abe260dae60c617
        run: |
          set -euo pipefail

          current="$(git rev-parse HEAD)"
          logo="$(mktemp)"
          git show "${current}:assets/branding/senzo-logo.png" > "$logo"
          test -s "$logo"

          git fetch --no-tags https://github.com/Sensei002/stremio-native.git main
          upstream="$(git rev-parse FETCH_HEAD)"
          if [[ "$upstream" != "$UPSTREAM_SHA" ]]; then
            echo "Pinned upstream changed: expected $UPSTREAM_SHA, received $upstream" >&2
            exit 1
          fi

          upstream_tree="$(git rev-parse "${upstream}^{tree}")"
          git read-tree --reset -u "$upstream_tree"

          mkdir -p assets/branding app/ui/assets/images
          cp "$logo" assets/branding/senzo-logo.png
          cp "$logo" app/ui/assets/images/senzo-logo.png

          cat > README.md <<'EOF'
          # SENZO

          **A native desktop media center built on the Stremio Native Rust application.**

          SENZO adopts the Stremio Native application foundation and develops its own product identity, interface, and release experience.

          ## Account access

          - Sign in with an existing Stremio account when synchronization and account-backed features are wanted.
          - Choose **Guest login** to use the application without creating or signing into a Stremio account.
          - SENZO does not operate its own hosted authentication service, user database, or application backend.
          - The desktop application still uses local on-device storage for settings, profiles, library data, and other application state.

          ## Technology

          - Rust workspace
          - Slint native desktop UI
          - Stremio Core integration
          - Embedded streaming server
          - libmpv playback
          - Windows-first development and packaging

          ## Build from source

          See the upstream build prerequisites and project scripts in this repository. The Windows native dependencies and vcpkg triplet are part of the build configuration; use the documented setup rather than substituting a generic vcpkg triplet.

          ## Upstream and license

          SENZO is based on [Stremio Native](https://github.com/stremio-native/stremio-native), imported initially from the Sensei002 fork at commit `936ee48771bb3d9c242ebc029abe260dae60c617`.

          This project retains the upstream **GPL-3.0-only** licensing and required notices. See [LICENSE](LICENSE) and [SENZO_UPSTREAM.md](SENZO_UPSTREAM.md).
          EOF

          cat > SENZO_UPSTREAM.md <<'EOF'
          # SENZO upstream provenance

          SENZO's initial application foundation was imported from:

          - Fork used: https://github.com/Sensei002/stremio-native
          - Original project: https://github.com/stremio-native/stremio-native
          - Imported source commit: `936ee48771bb3d9c242ebc029abe260dae60c617`
          - Upstream license: GPL-3.0-only

          The source snapshot is recorded as the second parent of the initial SENZO migration commit so the upstream history remains reachable in this repository. Keep upstream copyright notices, license files, dependency notices, and attribution when modifying or redistributing the application.

          SENZO-specific changes should be kept distinct from upstream-derived implementation changes where practical, so future upstream updates can be reviewed and merged deliberately.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          # Validate workspace metadata and Rust formatting before publishing the import.
          cargo metadata --locked --format-version 1 --no-deps > /tmp/senzo-cargo-metadata.json
          cargo fmt --all -- --check

          new_tree="$(git write-tree)"
          new_commit="$(printf '%s\n' "chore: adopt Stremio Native as SENZO foundation" | git commit-tree "$new_tree" -p "$current" -p "$upstream")"

          git update-ref -m "Import Stremio Native into SENZO" refs/heads/migration/stremio-native "$new_commit" "$current"
          git push origin refs/heads/migration/stremio-native:refs/heads/migration/stremio-native

          echo "Imported Stremio Native commit: $upstream"
          echo "Created SENZO migration commit: $new_commit"
