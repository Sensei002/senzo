name: Clippy

on:
  workflow_dispatch:
  pull_request:
    branches: [main, development]
    paths:
      - "**/*.rs"
      - "**/*.slint"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "vcpkg.json"
      - "triplets/**"
      - "vcpkg-overlays/**"
      - ".github/workflows/clippy.yml"
  push:
    branches: [main, development]
    paths:
      - "**/*.rs"
      - "**/*.slint"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - "vcpkg.json"
      - "triplets/**"
      - "vcpkg-overlays/**"
      - ".github/workflows/clippy.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  clippy:
    name: Rust workspace
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_DEFAULT_TRIPLET: x64-linux-v3-static-release
      VCPKGRS_TRIPLET: x64-linux-v3-static-release
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/vcpkg-overlays
      PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-v3-static-release/lib/pkgconfig
      LIBTORRENT_STATIC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libssl-dev libclang-dev libgtk-3-dev libayatana-appindicator3-dev libmpv-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Restore libtorrent cache
        id: libtorrent-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: Linux-vcpkg-x64-linux-v3-static-release-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            Linux-vcpkg-x64-linux-v3-static-release-v1-
      - name: Install static libtorrent 2.1.1
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgJsonGlob: "vcpkg.json"
          runVcpkgInstall: true
      - name: Save libtorrent cache
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg_installed
          key: Linux-vcpkg-x64-linux-v3-static-release-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
      # Keep Clippy on the app/library targets. All-targets also builds the
      # Slint test harness on this runner, which is both very slow and prone to
      # losing the runner after ~40 minutes. This scope still covers all
      # shipped application code while keeping the required check reliable.
      - name: Run Clippy
        # Surface compiler and lint diagnostics as check-run annotations. The
        # job log needs a token to download, but annotations are public, so a
        # failure stays diagnosable from any client.
        run: |
          set +e
          set -o pipefail
          cargo clippy --workspace --lib --bins --locked --keep-going --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'error(\[|:)' clippy.log | head -n 60 | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error title=Clippy::$line"
            done
          fi
          exit "$status"
