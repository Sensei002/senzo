name: Temporary Rust formatter

on:
  push:
    branches: [development]

permissions:
  contents: write
  actions: write

jobs:
  format:
    runs-on: windows-2022
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true

      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt and commit formatted source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Apply rustfmt to Batch 4 integration"
            git push origin HEAD:development
          }

      - name: Remove temporary formatter and dispatch Windows CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git rm .github/workflows/format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary CI formatter"
          git push origin HEAD:development
          gh workflow run ci.yml --ref development
